name: periferia
services:
 postgres:
  image: postgres:17-alpine
  environment:
   POSTGRES_USER: periferia
   POSTGRES_PASSWORD: local_only_change_me
   POSTGRES_DB: periferia
  ports: ["127.0.0.1:55483:5432"]
  volumes: ["postgres-data:/var/lib/postgresql/data"]
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U periferia"]
   interval: 5s
   retries: 10
 sqs:
  image: softwaremill/elasticmq-native:1.7.1
  ports: ["127.0.0.1:59324:9324"]
  volumes: ["./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro"]
volumes:
 postgres-data:

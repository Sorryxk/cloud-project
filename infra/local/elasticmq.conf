include classpath("application.conf")
node-address { protocol = http, host = "*", port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0" }
queues {
 reservation-dlq { defaultVisibilityTimeout = 30 seconds }
 reservation-events {
  defaultVisibilityTimeout = 30 seconds
  receiveMessageWait = 10 seconds
  deadLettersQueue { name = "reservation-dlq", maxReceiveCount = 5 }
 }
}
